{# Fallback template if none is found in "myshop/products/order-<product_model>-media.html" #}
{# It is used to render the figure in each line item when rendering the order detail view #}
<div class="d-flex">
	<a href="{{ product.get_absolute_url }}">
{% block product-image %}
		<img width="80" height="80" class="me-3" src="data:image/svg+xml;utf8,{% include './sample-image.svg' %}" />
{% endblock %}
	</a>
	<div class="flex-grow-1">
		<h5 class="mt-0"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h5>
		{{ product.caption|truncatewords_html:30 }}
	</div>
</div>
